<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة متابعة مراكز الخدمات التسويقية للمنتجات الزراعية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --green:#24463D;
    --green-2:#3C6657;
    --gold:#B69457;
    --stone:#F2EFE8;
    --card:#FFFFFF;
    --ink:#2B2B28;
    --sub:#8A8578;
    --rose:#B65C42;
    --line:#E2DDCF;
    --radius:14px;
    --shadow:0 1px 3px rgba(36,70,61,0.08), 0 6px 20px rgba(36,70,61,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--stone);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', Arial, sans-serif;
    font-weight:400;
    min-height:100vh;
  }
  h1,h2,h3,.brand,.bignum{font-family:'Almarai', Arial, sans-serif;}

  /* ===== Top bar ===== */
  header.top{
    background:var(--green);
    color:#fff;
    padding:22px 28px 0 28px;
  }
  .top-inner{max-width:1180px;margin:0 auto;}
  .brand-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .brand{font-size:20px;font-weight:800;letter-spacing:.2px;}
  .brand small{display:block;font-family:'IBM Plex Sans Arabic';font-weight:400;font-size:12.5px;color:#CFE0D8;margin-top:4px;}
  .data-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .btn{
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.08);
    color:#fff;
    padding:9px 16px;
    border-radius:10px;
    font-family:'IBM Plex Sans Arabic';
    font-size:13.5px;
    cursor:pointer;
    transition:background .2s, transform .15s;
  }
  .btn:hover{background:rgba(255,255,255,.18);}
  .btn:active{transform:translateY(1px);}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#2B2410;font-weight:600;}
  .btn.gold:hover{background:#c3a367;}
  #fileInput{display:none;}
  #dataStatus{font-size:12px;color:#CFE0D8;}

  /* Tabs */
  .tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:12px 18px;
    font-size:14px;
    color:#CFE0D8;
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
    font-weight:500;
    transition:color .2s, border-color .2s;
  }
  .tab:hover{color:#fff;}
  .tab.active{color:#fff;border-bottom-color:var(--gold);font-weight:700;}

  /* ===== Main ===== */
  main{max-width:1180px;margin:0 auto;padding:26px 28px 60px 28px;}
  .section-title{
    font-size:15.5px;
    font-weight:700;
    color:var(--green);
    margin:34px 0 14px 0;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-title .bar{width:5px;height:18px;background:var(--gold);border-radius:3px;display:inline-block;}
  .section-title:first-child{margin-top:0;}

  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px;
  }
  .card.compact{padding:16px 20px;}
  .grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;}
  .grid-2.rev{grid-template-columns:.85fr 1.15fr;}
  .grid-2.equal{grid-template-columns:1fr 1fr;}
  .grid-2.tablewide{grid-template-columns:1.5fr .5fr;}
  @media (max-width:820px){ .grid-2, .grid-2.rev, .grid-2.equal, .grid-2.tablewide{grid-template-columns:1fr;} }

  /* Project header */
  .project-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:2px;}
  .project-head h1{font-size:16.5px;color:var(--green);margin:0;line-height:1.45;max-width:760px;}
  .badge{
    display:inline-flex;align-items:center;gap:7px;
    padding:5px 12px;border-radius:20px;font-size:12.5px;font-weight:700;
  }
  .badge .dot{width:8px;height:8px;border-radius:50%;}
  .badge.running{background:#E6EFEA;color:var(--green);}
  .badge.running .dot{background:#3E8E63;}
  .badge.stopped{background:#F5E7E2;color:var(--rose);}
  .badge.stopped .dot{background:var(--rose);}

  /* info list */
  .info-list{list-style:none;margin:8px 0 0 0;padding:0;}
  .info-list li{
    display:flex;justify-content:space-between;align-items:center;
    padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;
  }
  .info-list li:last-child{border-bottom:none;}
  .info-list .k{color:var(--sub);}
  .info-list .v{font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:8px;}

  .doc-link{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:#EAF2ED;color:var(--green);text-decoration:none;font-size:12.5px;line-height:1;flex:0 0 auto;}
  .doc-link:hover{background:#D9E8DF;}
  .doc-link.disabled{background:#F1EFE8;color:#C9C3B2;opacity:.6;pointer-events:none;}

  .doc-num{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:700;text-decoration:none;cursor:pointer;}
  .doc-num:hover{text-decoration:underline;}
  .doc-num .doc-ico{font-size:12px;opacity:.85;}
  .doc-num.disabled{color:var(--ink);cursor:default;pointer-events:none;}
  .doc-num.disabled .doc-ico{opacity:.3;}

  .doc-link-wide{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:#EAF2ED;color:var(--green);font-size:11.5px;font-weight:700;text-decoration:none;white-space:nowrap;}
  .doc-link-wide:hover{background:#D9E8DF;}
  .doc-link-wide.disabled{background:#F1EFE8;color:#C0BAA8;pointer-events:none;}

  .donut-wrap{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;}
  .donut-wrap canvas{max-width:210px;max-height:210px;}
  .donut-legend{display:flex;gap:16px;margin-top:10px;font-size:12.5px;color:var(--sub);}
  .donut-legend span{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:10px;height:10px;border-radius:3px;display:inline-block;}

  /* stepper */
  .extract-block{margin-bottom:26px;}
  .extract-block:last-child{margin-bottom:0;}
  .extract-header{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:8px 10px;margin-bottom:16px;font-size:14px;}
  .extract-header .ex-num{color:var(--green);font-size:15px;font-weight:700;}
  .extract-header .ex-amount{color:var(--gold);font-weight:700;}
  .extract-header > :nth-child(odd){justify-self:start;}
  .extract-header > :nth-child(even){justify-self:end;}
  .stepper{margin:22px 4px 6px 4px;}
  .step-row{display:flex;justify-content:space-between;}
  .step-labels .label-item{width:16.6%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:0 2px;min-height:42px;}
  .step-labels .lbl-main{font-size:10px;font-weight:700;color:var(--ink);line-height:1.2;}
  .step-labels .lbl-sub{font-size:9px;font-weight:500;color:var(--sub);line-height:1.2;margin-top:2px;}
  .step-dots{position:relative;height:18px;margin:12px 0 8px 0;display:flex;justify-content:space-between;}
  .step-dots::before{content:'';position:absolute;top:50%;left:0;right:0;height:4px;background:var(--line);border-radius:2px;transform:translateY(-50%);z-index:0;}
  .step-dots .progress{position:absolute;top:50%;right:0;height:4px;background:var(--green-2);border-radius:2px;transform:translateY(-50%);z-index:1;transition:width .4s;}
  .step-dots .dot-item{position:relative;z-index:2;width:16.6%;display:flex;justify-content:center;}
  .step-dots .dot{width:18px;height:18px;border-radius:50%;background:var(--line);border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);}
  .step-dots .dot.done{background:var(--green-2);box-shadow:0 0 0 2px var(--green-2);}
  .step-dates .date-item{width:16.6%;text-align:center;font-size:10.5px;color:var(--sub);}
  .step-dates .date-item.done{color:var(--green);font-weight:600;}
  hr.soft{border:none;border-top:1px solid var(--line);margin:24px 0;}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    background:#EFEAE0;color:var(--green);text-align:center;font-weight:700;
    padding:10px 8px;border-bottom:2px solid var(--line);
  }
  tbody td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);}
  tfoot td{padding:11px 8px;text-align:center;border-top:2px solid var(--gold);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAF8F3;}
  .status-cell{display:flex;flex-direction:column;gap:5px;align-items:center;}
  .mini-bar{width:100%;max-width:170px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
  .mini-bar i{display:block;height:100%;background:var(--gold);}
  .mini-bar i.done{background:var(--green-2);}
  .status-text{font-size:12px;}
  .empty-note{color:var(--sub);font-size:13px;text-align:center;padding:22px 0;}

  /* summary cards */
  .summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
  @media (max-width:980px){.summary-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.summary-grid{grid-template-columns:1fr;}}
  .proj-card{cursor:pointer;transition:transform .15s, box-shadow .15s;}
  .proj-card:hover{transform:translateY(-3px);box-shadow:0 4px 10px rgba(36,70,61,.12), 0 10px 26px rgba(36,70,61,.10);}
  .proj-card h3{font-size:14.5px;margin:0 0 8px 0;color:var(--green);}
  .proj-card .val{font-size:12.5px;color:var(--sub);margin-top:10px;}
  .proj-card .val b{color:var(--ink);}
  .proj-bar{width:100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px;}
  .proj-bar i{display:block;height:100%;background:var(--green-2);}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media (max-width:820px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
  .kpi{padding:18px;}
  .kpi .lbl{font-size:12.5px;color:var(--sub);margin-bottom:6px;}
  .kpi .bignum{font-size:22px;color:var(--green);font-weight:800;}

  footer{text-align:center;color:var(--sub);font-size:12px;padding:20px 0 40px;}

  /* ===== PDF report layout (used only inside the combined PDF export) ===== */
  .pdf-project{margin-bottom:0;}
  .pdf-project-title{background:var(--green);color:#fff;padding:16px 22px;border-radius:14px 14px 0 0;font-family:'Almarai';font-size:19px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .pdf-project-title .pdf-badge{font-size:13.5px;font-weight:700;padding:6px 16px;border-radius:20px;color:#fff;white-space:nowrap;}
  .pdf-badge.pdf-badge-running{background:#2E7D53;}
  .pdf-badge.pdf-badge-stopped{background:#C0392B;}
  .pdf-body{border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;padding:20px;background:#fff;}
  .pdf-body, .pdf-body table, .pdf-body .pdf-info-list{color:#1D1D1A;}
  .pdf-panel{border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden;}
  .pdf-panel:last-child{margin-bottom:0;}
  .pdf-panel-title{background:#EFEAE0;color:var(--green);font-weight:700;font-size:15.5px;padding:10px 16px;border-bottom:1px solid var(--line);}
  .pdf-panel-body{padding:18px 20px;}
  .pdf-info-list{list-style:none;margin:0 0 4px 0;padding:0;}
  .pdf-info-list li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px;}
  .pdf-info-list li:last-child{border-bottom:none;}
  .pdf-info-list .k{color:var(--sub);font-weight:500;}
  .pdf-info-list .v{font-weight:700;color:#1D1D1A;display:inline-flex;align-items:center;gap:6px;}
  .pdf-stat-row{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;}
  .pdf-stat{flex:1;min-width:160px;text-align:center;background:#F8F6F1;border:1px solid var(--line);border-radius:8px;padding:12px 10px;}
  .pdf-stat .n{font-family:'Almarai';font-weight:800;font-size:21px;color:var(--green);}
  .pdf-stat .l{font-size:13px;color:var(--sub);margin-top:4px;font-weight:500;}
  .pdf-subgrid{display:flex;gap:16px;}
  .pdf-subgrid > div{flex:1;min-width:0;}
  .pdf-subtitle{font-size:14.5px;font-weight:700;color:var(--green);margin-bottom:10px;}
  table.pdf-table{width:100%;border-collapse:collapse;font-size:13.5px;border:1px solid var(--line);}
  table.pdf-table th, table.pdf-table td{border:1px solid var(--line);padding:8px 9px;text-align:center;color:#1D1D1A;font-weight:500;}
  table.pdf-table thead th{background:#EFEAE0;color:var(--green);font-weight:700;}
  table.pdf-table tfoot td{background:#F5F2EA;font-weight:700;color:var(--green);}
  table.pdf-table tbody tr:last-child td{border-bottom:1px solid var(--line);}
  .pdf-project .extract-header{font-size:15.5px;}
  .pdf-project .ex-num{font-size:16.5px;}
  .pdf-project .ex-amount{font-size:15.5px;}
  .pdf-project .label-item{min-height:58px;}
  .pdf-project .lbl-main{font-size:13.5px;}
  .pdf-project .lbl-sub{font-size:11.5px;}
  .pdf-project .date-item{font-size:12.5px;}
  .pdf-project .doc-link-wide{font-size:13px;padding:5px 14px;}
  .pdf-project .doc-num{font-size:13.5px;}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand-row">
      <div class="brand">لوحة متابعة مراكز الخدمات التسويقية للمنتجات الزراعية
      </div>
      <div class="data-controls">
        <span id="dataStatus">البيانات الحالية: نموذج افتراضي</span>
        <input type="file" id="fileInput" accept=".xlsx,.xls">
        <button class="btn gold" id="uploadBtn">⟳ تحديث البيانات من ملف إكسل</button>
        <button class="btn" id="pdfAllBtn">🖨 حفظ PDF</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main id="app"></main>


<script>
/* ============================= الإعدادات الثابتة ============================= */
const STAGE_KEYS = ['alfa','pmo1','rev1','siteEng','rev2','pmoFinal'];
function stageLabel(key, consultant){
  switch(key){
    case 'alfa': return {main:'رفع الطلب', sub:'ألفا ديم'};
    case 'pmo1': return {main:'مكتب إدارة المشاريع', sub:'ريف'};
    case 'rev1': return {main:'مراجعة 1 الاستشاري', sub:consultant};
    case 'siteEng': return {main:'استلام الاستشاري', sub:'مهندس الموقع'};
    case 'rev2': return {main:'مراجعة 2 الاستشاري', sub:consultant};
    case 'pmoFinal': return {main:'مراجعة إدارة المشاريع', sub:'ريف'};
  }
}
function buildReefStepperHtml(reefRows, consultant){
  if(!reefRows.length){
    return '<div class="empty-note">لا توجد مستخلصات مسجلة لهذا المشروع بعد</div>';
  }
  return reefRows.map(r=>{
    let lastDoneIndex = -1;
    STAGE_KEYS.forEach((k,idx)=>{ if(r.stages[k]) lastDoneIndex = idx; });
    const progressPct = lastDoneIndex>=0 ? ((lastDoneIndex + 0.5) / STAGE_KEYS.length) * 100 : 0;
    const labels = STAGE_KEYS.map(k=>{
      const l = stageLabel(k, consultant);
      return '<div class="label-item"><span class="lbl-main">'+esc(l.main)+'</span><span class="lbl-sub">'+esc(l.sub)+'</span></div>';
    }).join('');
    const dots = STAGE_KEYS.map(k=>{
      const done = !!r.stages[k];
      return '<div class="dot-item"><div class="dot '+(done?'done':'')+'"></div></div>';
    }).join('');
    const dates = STAGE_KEYS.map(k=>{
      const done = !!r.stages[k];
      return '<div class="date-item '+(done?'done':'')+'">'+(done?fmtDate(r.stages[k]):'لم تصل بعد')+'</div>';
    }).join('');
    return '<div class="extract-block">'
      + '<div class="extract-header"><b class="ex-num">المستخلص رقم '+esc(r.num)+'</b>'+reefLinkPill(r.reefLink,'رابط المستخلص في ريف')+'<span class="ex-amount">'+fmtMoney(r.amount)+'</span>'+reefLinkPill(r.hasrLink,'رابط الحصر في ريف')+'</div>'
      + '<div class="stepper">'
      +   '<div class="step-row step-labels">'+labels+'</div>'
      +   '<div class="step-dots"><div class="progress" style="width:'+progressPct+'%"></div>'+dots+'</div>'
      +   '<div class="step-row step-dates">'+dates+'</div>'
      + '</div>'
      + '</div>';
  }).join('<hr class="soft">');
}
const ETIMAD_STATUSES = [
  "تسجيل مطالبة (إرسال الطلب)",
  "إرفاق شهادة الإنجاز (قبول الطلب)",
  "تدقيق المطالبة (قبول الطلب)",
  "اعتماد المطالبة",
  "تسجيل أمر صرف (إرسال)",
  "اعتماد مدير الإدارة المالية لأمر الصرف",
  "اعتماد صاحب الصلاحية النهائي لأمر الصرف",
  "اعتماد المراقب المالي لأمر الصرف",
  "أمر صرف معتمد - مطالبة معتمدة",
  "تسجيل أمر دفع (إرسال)",
  "اعتماد مدقق أمر الدفع",
  "اعتماد مدير الإدارة المالية لأمر الدفع",
  "اعتماد صاحب الصلاحية النهائي لأمر الدفع",
  "اعتماد المراقب المالي لأمر الدفع",
  "تحويل أمر الدفع لوزارة المالية",
  "تم الصرف"
];

/* ============================= بيانات افتراضية ============================= */
const DEFAULT_DATA = {
  projects: [
    {key:"مركز جازان", fullName:"إنشاء وتجهيز مركز الخدمات التسويقية للمنتجات الزراعية بمنطقة جازان", consultant:"مدارات", status:"جاري", start:"2023-02-01", stop:"", resume:"", extension:30, end:"2025-06-30", value:42000000, completion:62,
      docs:{start:"https://example.com/docs/jazan-start.pdf", stop:"", resume:"", extension:"", value:"https://example.com/docs/jazan-value.pdf"}},
    {key:"مركز عسير", fullName:"إنشاء وتجهيز مركز الخدمات التسويقية للمنتجات الزراعية بمنطقة عسير", consultant:"مدارات", status:"جاري", start:"2023-03-15", stop:"2023-11-01", resume:"2024-01-10", extension:60, end:"2025-09-15", value:38500000, completion:48,
      docs:{start:"", stop:"", resume:"", extension:"", value:""}},
    {key:"مركز الباحة", fullName:"إنشاء وتجهيز مركز الخدمات التسويقية للمنتجات الزراعية بمنطقة الباحة", consultant:"مدارات", status:"متوقف", start:"2023-01-10", stop:"2024-06-01", resume:"", extension:0, end:"2025-05-20", value:31000000, completion:55,
      docs:{start:"", stop:"", resume:"", extension:"", value:""}},
    {key:"مركز القصيم", fullName:"إنشاء وتجهيز مركز الخدمات التسويقية للمنتجات الزراعية بمنطقة القصيم", consultant:"المنظور الشامل", status:"جاري", start:"2023-05-01", stop:"", resume:"", extension:45, end:"2025-12-01", value:45750000, completion:40,
      docs:{start:"", stop:"", resume:"", extension:"", value:""}},
    {key:"مركز حائل", fullName:"إنشاء وتجهيز مركز الخدمات التسويقية للمنتجات الزراعية بمنطقة حائل", consultant:"المنظور الشامل", status:"جاري", start:"2023-04-01", stop:"2023-09-01", resume:"2023-12-15", extension:20, end:"2025-10-10", value:36200000, completion:58,
      docs:{start:"", stop:"", resume:"", extension:"", value:""}}
  ],

function fmtDate(d){
  if(!d) return '—';
  let s;
  if(d instanceof Date){ if(isNaN(d)) return '—'; s = d.toISOString().slice(0,10); }
  else s = String(d);
  return ltrWrap(s);
}
function excelSerialToDate(serial){
  const utcDays = Math.floor(serial - 25569);
  const utcValue = utcDays * 86400;
  return new Date(utcValue * 1000);
}
function toDateStr(v){
  if(v === undefined || v === null || v === '') return '';
  if(v instanceof Date) return isNaN(v) ? '' : v.toISOString().slice(0,10);
  if(typeof v === 'number') return excelSerialToDate(v).toISOString().slice(0,10);
  const s = String(v).trim();
  if(!s) return '';
  const d = new Date(s);
  return isNaN(d) ? s : d.toISOString().slice(0,10);
}
function parseDateSafe(s){
  if(!s) return null;
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function destroyChart(id){ if(chartsRegistry[id]){ chartsRegistry[id].destroy(); delete chartsRegistry[id]; } }

const centerTextPlugin = {
  id:'centerText',
  afterDraw(chart){
    const opts = chart.config.options.plugins && chart.config.options.plugins.centerText;
    if(!opts) return;
    const {ctx, chartArea} = chart;
    if(!chartArea) return;
    const cx = (chartArea.left + chartArea.right)/2;
    const cy = (chartArea.top + chartArea.bottom)/2;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = "800 20px 'Almarai', Arial";
    ctx.fillStyle = opts.color || '#24463D';
    ctx.fillText(opts.line1, cx, cy - 11);
    ctx.font = "12px 'IBM Plex Sans Arabic', Arial";
    ctx.fillStyle = '#8A8578';
    ctx.fillText(opts.line2, cx, cy + 13);
    ctx.restore();
  }
};
if(window.Chart){ Chart.register(centerTextPlugin); Chart.defaults.animation = false; }

    })).filter(p=>p.key),
    reef: reefRows.map(r => ({

    etimad: etimadRows.map(r => ({

function loadWorkbook(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      applyWorkbookArrayBuffer(e.target.result, file.name);
    }catch(err){
      alert('تعذّرت قراءة الملف. تأكد أنه بنفس تنسيق قالب البيانات.\n' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

// Try to auto-load a data file hosted next to this dashboard (for a stable shared link
// that always shows the latest data without anyone needing to click "update").
// Silently falls back to the built-in sample data if none is found (e.g. opened locally).
async function autoLoadHostedData(){
  const candidates = ['project-data.xlsx', 'بيانات_لوحة_المشاريع.xlsx'];
  for(const name of candidates){
    try{
      const res = await fetch(encodeURI(name), {cache:'no-store'});
      if(!res.ok) continue;
      const buf = await res.arrayBuffer();
      applyWorkbookArrayBuffer(buf, name + ' (تحميل تلقائي من الاستضافة)');
      return;
    }catch(err){ /* try next candidate / fall back silently */ }
  }
}

/* ============================= حسابات مشتركة ============================= */
function projectDurationInfo(p){
  const start = parseDateSafe(p.start);
  const end = parseDateSafe(p.end);
  if(!start || !end || end<=start) return null;
  const today = new Date();
  const total = daysBetween(start,end);
  const elapsed = clamp(daysBetween(start, today), 0, total);
  const remaining = total - elapsed;
  return {total, elapsed, remaining};
}
function spentForProject(key){
  return DATA.etimad.filter(e=>e.project===key && e.status==='تم الصرف').reduce((s,e)=>s+ (Number(e.amount)||0), 0);
}

/* ============================= عرض ملخص جميع المشاريع ============================= */
function renderSummary(){
  const totalValue = DATA.projects.reduce((s,p)=>s+(Number(p.value)||0),0);
  const totalSpent = DATA.projects.reduce((s,p)=>s+spentForProject(p.key),0);
  const totalRemaining = Math.max(totalValue-totalSpent,0);
  const running = DATA.projects.filter(p=>p.status==='جاري').length;
  const stopped = DATA.projects.filter(p=>p.status==='متوقف').length;

  let cards = DATA.projects.map(p=>{
    const info = projectDurationInfo(p);
    const completion = clamp(Number(p.completion)||0, 0, 100);
    const badgeClass = p.status==='جاري' ? 'running':'stopped';
    const remainingText = info ? (info.remaining + ' يوم') : '—';
    return '<div class="card proj-card" data-f="'+esc(p.key)+'">'
      + '<h3>'+esc(shortName(p.key))+'</h3>'
      + '<span class="badge '+badgeClass+'"><span class="dot"></span>'+esc(p.status)+'</span>'
      + '<div class="proj-bar"><i style="width:'+completion+'%"></i></div>'
      + '<div class="val">نسبة الإنجاز: <b>'+completion+'%</b></div>'
      + '<div class="val">المدة المتبقية للمشروع: <b>'+remainingText+'</b></div>'
      + '<div class="val">قيمة المشروع: <b>'+fmtMoney(p.value)+'</b></div>'
      + '</div>';
  }).join('');

  const html = `
    <div class="section-title"><span class="bar"></span> ملخص عام لجميع المشاريع</div>
    <div class="kpi-row">
      <div class="card kpi"><div class="lbl">إجمالي قيمة المشاريع</div><div class="bignum">${fmtMoney(totalValue)}</div></div>
      <div class="card kpi"><div class="lbl">إجمالي المصروف</div><div class="bignum">${fmtMoney(totalSpent)}</div></div>
      <div class="card kpi"><div class="lbl">إجمالي المتبقي</div><div class="bignum">${fmtMoney(totalRemaining)}</div></div>
      <div class="card kpi"><div class="lbl">حالة المشاريع</div><div class="bignum">${running} جاري / ${stopped} متوقف</div></div>
    </div>

    <div class="section-title"><span class="bar"></span> المشاريع الخمسة</div>
    <div class="summary-grid">${cards}</div>

    <div class="section-title"><span class="bar"></span> مقارنة القيمة والمصروف والمتبقي لكل مشروع</div>
    <div class="card"><canvas id="chartAll" height="90"></canvas></div>
  `;
  document.getElementById('app').innerHTML = html;

  document.querySelectorAll('.proj-card').forEach(c=>{
    c.addEventListener('click', ()=>{ currentFilter = c.getAttribute('data-f'); renderTabs(); renderApp(); window.scrollTo({top:0,behavior:'smooth'}); });
  });

  destroyChart('chartAll');
  const chartAllCanvas = document.getElementById('chartAll');
  if(typeof Chart === 'undefined'){
    chartAllCanvas.parentElement.innerHTML = '<div class="empty-note">تعذّر تحميل مكتبة الرسوم البيانية (Chart.js). تحقّق من اتصال الجهاز بالإنترنت ثم أعد فتح الملف.</div>';
    return;
  }
  const ctx = chartAllCanvas.getContext('2d');
  chartsRegistry['chartAll'] = new Chart(ctx, {
    type:'bar',
    data:{
      labels: DATA.projects.map(p=>shortName(p.key)),
      datasets:[
        {label:'قيمة المشروع', data: DATA.projects.map(p=>p.value), backgroundColor:'#B69457', borderRadius:5},
        {label:'المصروف', data: DATA.projects.map(p=>spentForProject(p.key)), backgroundColor:'#24463D', borderRadius:5},
        {label:'المتبقي', data: DATA.projects.map(p=>Math.max(p.value-spentForProject(p.key),0)), backgroundColor:'#CFC7B2', borderRadius:5}
      ]
    },
    options:{
      responsive:true,
      plugins:{legend:{position:'bottom', rtl:true, labels:{font:{family:"'IBM Plex Sans Arabic'"}}}},
      scales:{
        x:{ticks:{font:{family:"'IBM Plex Sans Arabic'"}}, grid:{display:false}},
        y:{ticks:{callback:v=>v.toLocaleString('en-US')}, grid:{color:'#EFEAE0'}}
      }
    }
  });
}

/* ============================= عرض تفاصيل مشروع ============================= */
function buildProjectSections(key, mode){
  // mode: 'chart' (live UI, uses Chart.js canvases) or 'static' (bordered report layout, no charts, for combined PDF export)
  const p = DATA.projects.find(x=>x.key===key);
  if(!p) return null;

  const badgeClass = p.status==='جاري' ? 'running':'stopped';
  const info = projectDurationInfo(p);
  const spent = spentForProject(key);
  const remaining = Math.max((p.value||0) - spent, 0);
  const spentPct = Math.round((spent/((p.value)||1))*100);

  const reefRows = DATA.reef.filter(r=>r.project===key);
  const etimadRows = DATA.etimad.filter(r=>r.project===key);
  const manRows = DATA.manaqalat.filter(r=>r.project===key);
  const musRows = DATA.mustahdath.filter(r=>r.project===key);
  const taskRows = DATA.tasks.filter(r=>r.project===key).slice().sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  if(mode==='static'){
    // ---------- PDF report layout: bordered panels, gridded tables, no charts ----------
    const infoRows = [
      ['حالة المشروع', esc(p.status)],
      ['بداية المشروع', fmtDate(p.start)+' '+docIcon((p.docs||{}).start,'مستند بداية المشروع')],
      ['إيقاف المشروع', (p.stop?fmtDate(p.stop):'—')+' '+docIcon((p.docs||{}).stop,'مستند إيقاف المشروع')],
      ['استئناف المشروع', (p.resume?fmtDate(p.resume):'—')+' '+docIcon((p.docs||{}).resume,'مستند استئناف المشروع')],
      ['مدة تمديد المشروع', (p.extension?p.extension+' يوم':'—')+' '+docIcon((p.docs||{}).extension,'مستند تمديد المشروع')],
      ['نهاية المشروع', fmtDate(p.end)],
      ['قيمة المشروع', fmtMoney(p.value)+' '+docIcon((p.docs||{}).value,'مستند قيمة المشروع')]
    ];
    const infoPanel = `
      <div class="pdf-panel">
        <div class="pdf-panel-title">بيانات المشروع</div>
        <div class="pdf-panel-body">
          <ul class="pdf-info-list">
            ${infoRows.map(r=>'<li><span class="k">'+r[0]+'</span><span class="v">'+r[1]+'</span></li>').join('')}
          </ul>
          <div class="pdf-stat-row">
            <div class="pdf-stat"><div class="n">${info ? (info.remaining+' يوم') : '—'}</div><div class="l">المدة المتبقية</div></div>
            <div class="pdf-stat"><div class="n">${clamp(Number(p.completion)||0,0,100)}%</div><div class="l">نسبة الإنجاز</div></div>
            <div class="pdf-stat"><div class="n">${spentPct}%</div><div class="l">نسبة الصرف ${ltrWrap('('+fmtMoneyRaw(spent)+')')}</div></div>
          </div>
        </div>
      </div>`;

    const reefBody = buildReefStepperHtml(reefRows, p.consultant);
    const reefPanel = `<div class="pdf-panel"><div class="pdf-panel-title">سير المستخلص في منصة ريف</div><div class="pdf-panel-body">${reefBody}</div></div>`;

    let etimadBody;
    if(!etimadRows.length){
      etimadBody = '<div class="empty-note">لا توجد بيانات اعتماد مسجلة لهذا المشروع</div>';
    }else{
      const rows = etimadRows.map(r=>{
        const done = r.status === 'تم الصرف';
        const statusDateObj = parseDateSafe(r.statusDate);
        const daysInStatus = (!done && statusDateObj) ? Math.max(daysBetween(statusDateObj, new Date()), 0) : null;
        return '<tr>'
          + '<td>'+docNumCell(r.docLink, r.num)+'</td>'
          + '<td>'+fmtMoney(r.amount)+'</td>'
          + '<td>'+esc(r.status||'—')+'</td>'
          + '<td>'+(statusDateObj?fmtDate(r.statusDate):'—')+'</td>'
          + '<td>'+(daysInStatus!==null?(daysInStatus+' يوم'):'—')+'</td>'
          + '</tr>';
      }).join('');
      etimadBody = '<table class="pdf-table"><thead><tr><th>رقم المستخلص</th><th>المبلغ</th><th>الحالة في اعتماد</th><th>تاريخ الحالة</th><th>عدد الأيام</th></tr></thead><tbody>'+rows+'</tbody>'
        + '<tfoot><tr><td>الإجمالي</td><td>'+fmtMoney(etimadRows.reduce((s,r)=>s+(Number(r.amount)||0),0))+'</td><td></td><td></td><td></td></tr></tfoot></table>';
    }
    const etimadPanel = `<div class="pdf-panel"><div class="pdf-panel-title">سير المستخلص في منصة اعتماد</div><div class="pdf-panel-body">${etimadBody}</div></div>`;

    const manBody = manRows.length
      ? '<table class="pdf-table"><thead><tr><th>المناقلة</th><th>المبلغ</th><th>الإجراء الحالي</th></tr></thead><tbody>'
        + manRows.map(r=>'<tr><td>'+docNumCell(r.docLink,'مناقلة '+r.num)+'</td><td>'+fmtMoney(r.amount)+'</td><td>'+esc(r.action)+'</td></tr>').join('')
        + '</tbody></table>'
      : '<div class="empty-note">لا توجد مناقلات مسجلة</div>';
    const musBody = musRows.length
      ? '<table class="pdf-table"><thead><tr><th>المستحدث</th><th>المبلغ</th><th>الإجراء الحالي</th></tr></thead><tbody>'
        + musRows.map(r=>'<tr><td>'+docNumCell(r.docLink,'مستحدث '+r.num)+'</td><td>'+fmtMoney(r.amount)+'</td><td>'+esc(r.action)+'</td></tr>').join('')
        + '</tbody></table>'
      : '<div class="empty-note">لا توجد بنود مستحدثة مسجلة</div>';
    const manMusPanel = `
      <div class="pdf-panel">
        <div class="pdf-panel-title">المناقلات والبنود المستحدثة</div>
        <div class="pdf-panel-body">
          <div class="pdf-subgrid">
            <div><div class="pdf-subtitle">المناقلات</div>${manBody}</div>
            <div><div class="pdf-subtitle">البنود المستحدثة</div>${musBody}</div>
          </div>
        </div>
      </div>`;

    const taskBody = taskRows.length
      ? '<table class="pdf-table"><thead><tr><th style="width:110px">التاريخ</th><th style="text-align:right">المهمة / الإجراء</th></tr></thead><tbody>'
        + taskRows.map(r=>'<tr><td>'+fmtDate(r.date)+'</td><td style="text-align:right">'+esc(r.text)+'</td></tr>').join('')
        + '</tbody></table>'
      : '<div class="empty-note">لا توجد مهام مسجلة لهذا المشروع</div>';
    const taskPanel = `<div class="pdf-panel"><div class="pdf-panel-title">سجل المهام والإجراءات</div><div class="pdf-panel-body">${taskBody}</div></div>`;

    const html = `
      <section class="pdf-project">
        <div class="pdf-project-title">
          <span>${esc(p.fullName || p.key)}</span>
          <span class="pdf-badge ${p.status==='جاري'?'pdf-badge-running':'pdf-badge-stopped'}">${esc(p.status)}</span>
        </div>
        <div class="pdf-body">
          ${infoPanel}
          ${reefPanel}
          ${etimadPanel}
          ${manMusPanel}
          ${taskPanel}
        </div>
      </section>`;
    return {p, info, spent, remaining, html};
  }

  // ---------------------------- live dashboard layout (unchanged) ----------------------------
  const infoHtml = `
    <div class="card compact">
      <div class="project-head">
        <h1>${esc(p.fullName || p.key)}</h1>
        <span class="badge ${badgeClass}"><span class="dot"></span>${esc(p.status)}</span>
      </div>
      <ul class="info-list">
        <li><span class="k">حالة المشروع</span><span class="v">${esc(p.status)}</span></li>
        <li><span class="k">بداية المشروع</span><span class="v">${fmtDate(p.start)} ${docIcon((p.docs||{}).start,'مستند بداية المشروع')}</span></li>
        <li><span class="k">إيقاف المشروع</span><span class="v">${p.stop?fmtDate(p.stop):'—'} ${docIcon((p.docs||{}).stop,'مستند إيقاف المشروع')}</span></li>
        <li><span class="k">استئناف المشروع</span><span class="v">${p.resume?fmtDate(p.resume):'—'} ${docIcon((p.docs||{}).resume,'مستند استئناف المشروع')}</span></li>
        <li><span class="k">مدة تمديد المشروع</span><span class="v">${p.extension?p.extension+' يوم':'—'} ${docIcon((p.docs||{}).extension,'مستند تمديد المشروع')}</span></li>
        <li><span class="k">نهاية المشروع</span><span class="v">${fmtDate(p.end)}</span></li>
        <li><span class="k">قيمة المشروع</span><span class="v">${fmtMoney(p.value)} ${docIcon((p.docs||{}).value,'مستند قيمة المشروع')}</span></li>
      </ul>
    </div>
    <div class="card donut-wrap">
      <canvas id="donutProject" width="210" height="210"></canvas>
      <div class="donut-legend">
        <span><i class="swatch" style="background:#24463D"></i> منقضي</span>
        <span><i class="swatch" style="background:#E2DDCF"></i> متبقي</span>
      </div>
    </div>
  `;

  const reefHtml = buildReefStepperHtml(reefRows, p.consultant);

  let etimadTable = '';
  if(!etimadRows.length){
    etimadTable = '<div class="empty-note">لا توجد بيانات اعتماد مسجلة لهذا المشروع</div>';
  }else{
    const rows = etimadRows.map(r=>{
      const idx = ETIMAD_STATUSES.indexOf(r.status);
      const pct = idx>=0 ? Math.round((idx/(ETIMAD_STATUSES.length-1))*100) : 0;
      const done = r.status === 'تم الصرف';
      const statusDateObj = parseDateSafe(r.statusDate);
      const daysInStatus = (!done && statusDateObj) ? Math.max(daysBetween(statusDateObj, new Date()), 0) : null;
      return '<tr>'
        + '<td>'+docNumCell(r.docLink, r.num)+'</td>'
        + '<td>'+fmtMoney(r.amount)+'</td>'
        + '<td><div class="status-cell"><div class="status-text">'+esc(r.status||'—')+'</div>'
        + '<div class="mini-bar"><i class="'+(done?'done':'')+'" style="width:'+pct+'%"></i></div></div></td>'
        + '<td>'+(statusDateObj?fmtDate(r.statusDate):'—')+'</td>'
        + '<td>'+(daysInStatus!==null?(daysInStatus+' يوم'):'—')+'</td>'
        + '</tr>';
    }).join('');
    etimadTable = '<table><thead><tr><th>رقم المستخلص</th><th>مبلغ المستخلص</th><th>الحالة في منصة اعتماد</th><th>تاريخ الحالة</th><th>عدد الأيام</th></tr></thead><tbody>'+rows+'</tbody>'
      + '<tfoot><tr><td style="font-weight:700;color:var(--green);background:#F5F2EA">الإجمالي</td>'
      + '<td style="font-weight:700;color:var(--green);background:#F5F2EA">'+fmtMoney(etimadRows.reduce((s,r)=>s+(Number(r.amount)||0),0))+'</td>'
      + '<td style="background:#F5F2EA"></td><td style="background:#F5F2EA"></td><td style="background:#F5F2EA"></td></tr></tfoot></table>';
  }

  const moneyCard = `<div class="card donut-wrap"><canvas id="donutMoney" width="210" height="210"></canvas>
      <div class="donut-legend">
        <span><i class="swatch" style="background:#24463D"></i> مصروف</span>
        <span><i class="swatch" style="background:#E2DDCF"></i> متبقي</span>
      </div>
    </div>`;

  const manTable = manRows.length
    ? '<table><thead><tr><th>المناقلة</th><th>المبلغ</th><th>الإجراء الحالي</th></tr></thead><tbody>'
      + manRows.map(r=>'<tr><td>'+docNumCell(r.docLink, 'مناقلة '+r.num)+'</td><td>'+fmtMoney(r.amount)+'</td><td>'+esc(r.action)+'</td></tr>').join('')
      + '</tbody></table>'
    : '<div class="empty-note">لا توجد مناقلات مسجلة</div>';

  const musTable = musRows.length
    ? '<table><thead><tr><th>المستحدث</th><th>المبلغ</th><th>الإجراء الحالي</th></tr></thead><tbody>'
      + musRows.map(r=>'<tr><td>'+docNumCell(r.docLink, 'مستحدث '+r.num)+'</td><td>'+fmtMoney(r.amount)+'</td><td>'+esc(r.action)+'</td></tr>').join('')
      + '</tbody></table>'
    : '<div class="empty-note">لا توجد بنود مستحدثة مسجلة</div>';

  const taskTable = taskRows.length
    ? '<table><thead><tr><th style="width:140px">التاريخ</th><th style="text-align:right;padding-right:16px">المهمة / الإجراء</th></tr></thead><tbody>'
      + taskRows.map(r=>'<tr><td>'+fmtDate(r.date)+'</td><td style="text-align:right;padding-right:16px">'+esc(r.text)+'</td></tr>').join('')
      + '</tbody></table>'
    : '<div class="empty-note">لا توجد مهام مسجلة لهذا المشروع</div>';

  const html = `
    <div class="grid-2 rev">${infoHtml}</div>

    <div class="section-title"><span class="bar"></span> سير المستخلص في منصة ريف</div>
    <div class="card">${reefHtml}</div>

    <div class="section-title"><span class="bar"></span> سير المستخلص في منصة اعتماد</div>
    <div class="grid-2 tablewide">
      <div class="card">${etimadTable}</div>
      ${moneyCard}
    </div>

    <div class="section-title"><span class="bar"></span> المناقلات والبنود المستحدثة</div>
    <div class="grid-2 equal">
      <div class="card"><h3 style="margin:0 0 12px;font-size:14px;color:var(--green)">المناقلات</h3>${manTable}</div>
      <div class="card"><h3 style="margin:0 0 12px;font-size:14px;color:var(--green)">البنود المستحدثة</h3>${musTable}</div>
    </div>

    <div class="section-title"><span class="bar"></span> سجل المهام والإجراءات</div>
    <div class="card">${taskTable}</div>

  return {p, info, spent, remaining, html};
}

function renderProject(key){
  const sections = buildProjectSections(key, 'chart');
  if(!sections){ document.getElementById('app').innerHTML = '<div class="empty-note">لا توجد بيانات لهذا المشروع</div>'; return; }
  const {p, info, spent, remaining} = sections;
  document.getElementById('app').innerHTML = sections.html;

  // donut duration
  if(typeof Chart === 'undefined'){
    const note = '<div class="empty-note">تعذّر تحميل مكتبة الرسوم البيانية (Chart.js). تحقّق من اتصال الجهاز بالإنترنت ثم أعد فتح الملف.</div>';
    document.getElementById('donutProject').parentElement.innerHTML = note;
    document.getElementById('donutMoney').parentElement.innerHTML = note;
    return;
  }
  destroyChart('donutProject');
  const c1 = document.getElementById('donutProject').getContext('2d');
  if(info){
    chartsRegistry['donutProject'] = new Chart(c1, {
      type:'doughnut',
      data:{labels:['منقضي','متبقي'], datasets:[{data:[info.elapsed, info.remaining], backgroundColor:['#24463D','#E2DDCF'], borderWidth:0}]},
      options:{cutout:'72%', plugins:{legend:{display:false}, centerText:{line1: info.remaining + ' يوم', line2:'متبقٍ على الانتهاء'}}}
    });
  }else{
    chartsRegistry['donutProject'] = new Chart(c1, {
      type:'doughnut', data:{labels:['غير محدد'], datasets:[{data:[1], backgroundColor:['#E2DDCF']}]},
      options:{cutout:'72%', plugins:{legend:{display:false}, centerText:{line1:'—', line2:'تواريخ غير مكتملة'}}}
    });
  }

  // donut money
  destroyChart('donutMoney');
  const c2 = document.getElementById('donutMoney').getContext('2d');
  chartsRegistry['donutMoney'] = new Chart(c2, {
    type:'doughnut',
    data:{labels:['مصروف','متبقي'], datasets:[{data:[spent, remaining], backgroundColor:['#24463D','#E2DDCF'], borderWidth:0}]},
    options:{cutout:'72%', plugins:{legend:{display:false}, centerText:{line1: Math.round((spent/((p.value)||1))*100)+'%', line2:'نسبة الصرف'}}}
  });
}

/* ============================= التحكم العام ============================= */
function renderApp(){
  if(currentFilter === 'all'){ renderSummary(); }
  else{ renderProject(currentFilter); }
}

renderTabs();
renderApp();
autoLoadHostedData();
</script>
